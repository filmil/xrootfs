name: Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "43 7 * * 0"
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build
        run: "bazel build //..."
      - name: Test
        run: "bazel test --test_output=errors //..."

  # BCR presubmit runs exactly this, from .bcr/presubmit.yml. Running it here
  # too means a break shows up on the pull request rather than in a registry
  # pull request that is already open. The matrix mirrors the presubmit one,
  # as far as GitHub runners allow: macos-15-intel is the x86_64 Mac,
  # macos-latest the arm64 one.
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-15-intel, macos-latest]
        bazel: [8.x, 9.x]
    runs-on: ${{ matrix.os }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: true
      - name: Integration test
        run: "cd integration && bazel test --test_output=errors //..."

