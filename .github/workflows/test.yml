name: Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "43 7 * * 0"
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build
        run: "bazel build //..."
      - name: Test
        run: "bazel test --test_output=errors //..."
      # BCR presubmit runs exactly this, from .bcr/presubmit.yml. Running it
      # here too means a break shows up on the pull request rather than in a
      # registry pull request that is already open.
      - name: Integration test
        run: "cd integration && bazel test --test_output=errors //..."

