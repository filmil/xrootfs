# When run:
# * runs tests to ensure that released version works.
# * tags a new release based on main top of tree.
# * builds a source bundle and uploads it into the release
# * builds binaries and uploads them into the release
#
# The workflow can be run manually, otherwise it runs once a week.
name: Tag and Release

env:
  # The env here is tailored to releasing *one* binary.
  # ZIP_PACKAGE is the package where the zip target is. For //test in this
  # example, the label of the bazel target that zips up a built and released
  # binary is `//test:zip`.
  ZIP_PACKAGE: "//cmd/xrootfs"
  # The name of the binary to package. This workflow packages a single binary
  # into a zip file.
  BINARY_NAME: "bazel-bin/cmd/xrootfs/xrootfs"
  ZIP_PACKAGE2: "//cmd/imagecfg"
  BINARY_NAME2: "bazel-bin/cmd/imagecfg/imagecfg"

on:
  schedule:
    - cron: '0 0 13 * *'
  workflow_dispatch:

jobs:
  # The scheduled run used to bump a version whether or not anything had
  # landed, so the same tree was released again and again (see the tags that
  # share one commit). This job asks the only question that matters -- did
  # anything get committed since the last release? -- and every job below
  # hangs off the answer.
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags: `git describe` needs both, and the default
          # shallow checkout has neither.
          fetch-depth: 0
      - name: Look for commits since the last release
        id: changes
        run: |
          set -o errexit -o nounset -o pipefail
          latest="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "${latest}" ]; then
            echo "No tag yet; releasing."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "$(git rev-list -n 1 "${latest}")" = "$(git rev-parse HEAD)" ]; then
            echo "HEAD is already released as ${latest}. Nothing to release."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "$(git rev-list --count "${latest}"..HEAD) commit(s) since ${latest}; releasing."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  tag:
    needs: check
    if: ${{ needs.check.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    # A repository whose default workflow permission is read-only fails the
    # tag push with "Resource not accessible by integration", after the action
    # has already printed the version it computed.
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The tag action analyses the commits since the previous tag. With
          # the default shallow checkout it finds none, reports "Analysis of 0
          # commits complete: no release", and emits an empty new_tag.
          fetch-depth: 0
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          # Without this the action bumps the patch version on every run. The
          # `check` job above stops a run whose HEAD is already released; this
          # stops one where commits did land but none of them is `fix:`,
          # `feat:` or `BREAKING:`.
          default_bump: false

  # Runs the tests, builds xrootfs-<tag>.zip through
  # .github/workflows/release_prep.sh, attests it with
  # actions/attest-build-provenance, and creates the GitHub release.
  #
  # This reusable workflow is not interchangeable with a local equivalent. The
  # Bazel Central Registry verifies the source archive attestation with
  # slsa-verifier against a hard-coded builder id, set in tools/slsa.py of
  # bazelbuild/bazel-central-registry, and that id names release_ruleset.yaml.
  source_release:
    needs: tag
    if: ${{ needs.tag.outputs.tag_name != '' }}
    permissions:
      contents: write      # upload release files
      id-token: write      # attest provenance
      attestations: write  # attest provenance
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
      release_files: |
        xrootfs-${{ needs.tag.outputs.tag_name }}.zip
      prerelease: false
      bazel_test_command: "bazel test --test_output=errors //..."

  release:
    needs: [tag, source_release]
    if: ${{ needs.tag.outputs.tag_name != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: ["386", "amd64"]
        os: ["linux"]
    steps:
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Checkout
        uses: actions/checkout@v2
      - name: Cache
        uses: actions/cache@v4
        with:
          path: "~/.cache/bazel"
          key: ${{ runner.os }}-${{ matrix.arch }}-bazel-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-bazel-
      - name: "Test"
        run: "bazel test --test_output=errors //..."
      - name: "Build binaries for ${{ matrix.os }}_${{ matrix.arch }}"
        run: |
          bazel build \
            --platforms=@rules_go//go/toolchain:${{ matrix.os }}_${{ matrix.arch}} \
            --//build:name_part_from_command_line=${{ matrix.os }}-${{ matrix.arch }} \
            ${ZIP_PACKAGE}:zip ${ZIP_PACKAGE2}:zip
      - name: "Publish ${{ matrix.os }}_${{ matrix.arch }}"
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          allowUpdates: true
          artifacts: "${{ env.BINARY_NAME }}-${{ matrix.os }}-${{ matrix.arch }}.zip, ${{ env.BINARY_NAME2}}-${{ matrix.os }}-${{ matrix.arch }}.zip"
          tag: ${{ needs.tag.outputs.tag_name }}

  # This workflow waits for binary artifacts to be published.
  publish:
    needs: [tag, source_release, release]
    if: ${{ needs.tag.outputs.tag_name != '' }}
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}


  # BCR is the only publish that attests, see the note in publish.yml. This job
  # still runs after that one rather than beside it, so that the order in which
  # the two registries see the release stays fixed, and so that turning
  # `attest` back on in publish.yml cannot silently produce two attesting
  # publishes racing to overwrite the same two release assets.
  publish-bcr:
    needs: [tag, publish]
    if: ${{ needs.tag.outputs.tag_name != '' }}
    uses: ./.github/workflows/publish-bcr.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
    # publish-bcr.yml reads secrets.BCR_PUBLISH_TOKEN directly and declares no
    # workflow_call secrets, so it has to inherit them.
    secrets: inherit
